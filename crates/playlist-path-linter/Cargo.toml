[package]
name = "playlist-path-linter"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Catch path, Unicode, and date corruption before importing M3U playlists"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-playlist-path-linter"
readme = "../../README.md"
keywords = ["m3u", "playlist", "unicode", "music", "cli"]
categories = ["command-line-utilities", "filesystem"]

[lib]
name = "playlist_path_linter"
path = "src/lib.rs"

[[bin]]
name = "playlist-path-linter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
encoding_rs = "0.8"
lofty = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

